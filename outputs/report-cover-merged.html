<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>报告封面 · 合并后预览</title>
<style>
  :root{
    --canvas: oklch(0.975 0.004 250);
    --surface: oklch(0.995 0.002 250);
    --surface-muted: oklch(0.955 0.008 250);
    --ink: oklch(0.22 0.025 255);
    --ink-muted: oklch(0.48 0.02 255);
    --line: oklch(0.88 0.012 250);
    --accent: oklch(0.48 0.13 245);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .report-cover{ width:100%; max-width:820px; margin:32px auto; }
  .report-cover__overview{ border-bottom:1px solid var(--line); padding-bottom:24px; margin-bottom:28px; }
  .report-cover__overview .eyebrow{ font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
  .report-cover__overview h2{ margin:10px 0 10px; font-size:30px; line-height:1.3; }
  .report-cover__overview p{ margin:0; color:var(--ink-muted); font-size:14px; line-height:1.8; }
  .section-title{ margin-bottom:18px; }
  .section-title .eyebrow{ font-size:11px; color:var(--ink-muted); letter-spacing:.08em; text-transform:uppercase; }
  .section-title h3{ margin:6px 0 0; font-size:15px; font-weight:600; color:var(--ink); }
  .report-cover__grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .report-cover__card{ display:grid; gap:5px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:13px 15px; }
  .report-cover__card span{ color:var(--ink-muted); font-size:11px; }
  .report-cover__card strong{ font-size:15px; font-weight:600; }
  .report-cover__meta-cta{ display:flex; align-items:center; justify-content:space-between; gap:12px; grid-column:1 / -1; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); padding:14px 18px; text-decoration:none; font-size:14px; font-weight:600; }
  .report-cover__meta-cta:hover{ border-color:var(--accent); color:var(--accent); }
  .report-cover__summary{ margin-top:32px; padding-top:28px; border-top:1px solid var(--line); }
  .report-cover__lead{ margin:0; font-size:15px; line-height:1.9; color:var(--ink); }
</style>
</head>
<body>
<div class="report-cover">
  <section class="report-cover__overview">
    <span class="eyebrow">三元结构分析报告 · 组合分析</span>
    <h2>某舆情事件的结构化分析报告</h2>
    <p>来自"唐山烧烤事件复盘"的分析任务，已生成 v1 版本。</p>
  </section>

  <section>
    <div class="section-title">
      <div><span class="eyebrow">任务元数据</span><h3>报告信息</h3></div>
    </div>
    <div class="report-cover__grid">
      <div class="report-cover__card"><span>分析类型</span><strong>组合分析</strong></div>
      <div class="report-cover__card"><span>执行引擎</span><strong>语言模型</strong></div>
      <div class="report-cover__card"><span>报告版本</span><strong>v1</strong></div>
      <div class="report-cover__card"><span>更新时间</span><strong>8月26日 02:56</strong></div>
      <div class="report-cover__card"><span>关联材料</span><strong>0 份</strong></div>
      <div class="report-cover__card"><span>正文章节</span><strong>10 章</strong></div>
      <div class="report-cover__card"><span>报告字数</span><strong>9,190 字</strong></div>
      <div class="report-cover__card"><span>预计阅读</span><strong>~23 分钟</strong></div>
      <a class="report-cover__meta-cta" href="#">
        <span>开始阅读正文</span>
        <span style="font-size:16px;">→</span>
      </a>
    </div>
  </section>

  <section class="report-cover__summary">
    <div class="section-title">
      <div><span class="eyebrow">内容摘要</span><h3>情况概述</h3></div>
    </div>
    <p class="report-cover__lead">报告正文从「情况概述」章节开始，后续章节逐步展开主体、利益与关系的结构化分析。</p>
  </section>
</div>
</body>
</html>
